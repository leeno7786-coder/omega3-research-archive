$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "omega://schema/cognition_chain/v1"
title: CognitionChainTypes

definitions:
  CognitionChainConfig:
    type: object
    required: [cognition_chain]
    properties:
      cognition_chain:
        type: object
        additionalProperties: false
        required: [motor_programs, fetched_comprehension]
        properties:
          motor_programs:
            type: object
            additionalProperties: false
            required:
              - enabled
              - shadow_mode
              - eligible_actions
              - max_parse_attempts
              - timeout_seconds
              - equivalent_no_progress_limit
              - distinct_failure_limit
            properties:
              enabled: { type: boolean }
              shadow_mode: { type: boolean }
              eligible_actions:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum: [USE_TOOL, USE_SKILL, EXECUTE_MOTOR_PROGRAM]
              max_parse_attempts: { type: integer, minimum: 1 }
              timeout_seconds: { type: integer, minimum: 60, maximum: 900 }
              equivalent_no_progress_limit: { type: integer, minimum: 1 }
              distinct_failure_limit: { type: integer, minimum: 1 }
          fetched_comprehension:
            type: object
            additionalProperties: false
            required: [timeout_seconds]
            properties:
              timeout_seconds: { type: integer, minimum: 60, maximum: 900 }
