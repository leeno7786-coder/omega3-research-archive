$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "omega://schema/tts/v1"
title: TTSTypes

definitions:
  TTSRequest:
    type: object
    required: [text]
    properties:
      text: { type: string }
      voice: { type: string, default: Aiden }
      length_scale: { type: number, minimum: 0.1, default: 1.0 }

  TTSConfig:
    type: object
    required: [tts]
    properties:
       tts:
         type: object
         required: [default_voice, length_scale, synthesise_timeout_seconds, warmup_on_boot]
         properties:
           engine: { type: string, enum: [auto, kokoro, qwen, qwen3, qwen3-tts] }
           default_voice: { type: string, minLength: 1 }
           length_scale: { type: number, exclusiveMinimum: 0 }
           pitch: { type: number, exclusiveMinimum: 0 }
           synthesise_timeout_seconds: { type: integer, minimum: 30 }
           warmup_on_boot: { type: boolean }
           qwen:
             type: object
             properties:
               root: { type: string, minLength: 1 }
               binary: { type: string, minLength: 1 }
               model: { type: string, minLength: 1 }
               codec: { type: string, minLength: 1 }
               host: { type: string, minLength: 1 }
               port: { type: integer, minimum: 1, maximum: 65535 }
               speaker: { type: string, minLength: 1 }
               alias: { type: string, minLength: 1 }
               device: { type: string, minLength: 1 }
               provider: { type: string, minLength: 1 }
               start_timeout_seconds: { type: number, minimum: 5 }
