$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "omega://schema/web_sources/v1"
title: WebSourcesTypes

definitions:
  WebSourcesConfig:
    type: object
    required: [schema_version, sources]
    properties:
      schema_version: { type: integer }
      sources:
        type: array
        items:
          type: object
          required: [url, name, tier, domain]
          properties:
            url: { type: string }
            name: { type: string }
            tier: { type: string }
            domain: { type: string }
            note: { type: string }
      tier_order:
        type: array
        items: { type: string }
      domain_defaults:
        type: object
        additionalProperties: { type: string }
