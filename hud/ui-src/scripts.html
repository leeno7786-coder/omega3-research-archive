    function _statusClassForTag(t) {
      const s = String(t == null ? '' : t).trim().toLowerCase();
      if (!s) return '';
      if (s === 'live' || s === 'ok' || s === 'pass' || s === 'ready' || s === 'active' || s === 'running') {
        return 'tag-ok';
      }
      if (s === 'fail' || s === 'error' || s === 'critical' || s === 'broken' || s === 'down') {
        return 'tag-fail';
      }
      if (s === 'warn' || s === 'degraded' || s === 'amber' || s === 'paused') {
        return 'tag-warn';
      }
      if (s === 'idle' || s === '—' || s === '-' || s === 'n/a' || s === 'na' || s === 'unknown') {
        return 'tag-idle';
      }
      return 'tag-neutral';
    }

    function row(b, k, v, t) {
      const el = document.createElement('div');
      el.className = 'panel-row';
      const tag = t || '';
      const tagCls = _statusClassForTag(tag);
      el.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span><span class="t ${tagCls}">${tag}</span>`;
      b.appendChild(el);
    }
    function section(b, label) {
      const wrap = document.createElement('div');
      wrap.className = 'panel-section';
      const lab = document.createElement('div');
      lab.className = 'panel-label';
      lab.textContent = label;
      wrap.appendChild(lab);
      b.appendChild(wrap);
      return wrap;
    }
