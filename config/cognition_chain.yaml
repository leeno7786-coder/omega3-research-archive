cognition_chain:
  motor_programs:
    enabled: true
    shadow_mode: false
    eligible_actions: [USE_TOOL, USE_SKILL, EXECUTE_MOTOR_PROGRAM]
    max_parse_attempts: 2
    timeout_seconds: 600
    equivalent_no_progress_limit: 2
    distinct_failure_limit: 3
  fetched_comprehension:
    timeout_seconds: 600
