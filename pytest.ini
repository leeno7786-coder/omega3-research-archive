[pytest]
# Omega 3.0 - Pytest Configuration
# Generated:   2026-05-15
# Fixed:       2026-05-17 (consolidated duplicate addopts)
# Cleaned up:  2026-05-25 (PACKET_P2_S20-followup — removed 5 keys that
#              pytest rejected with PytestConfigWarning):
#                showlocals = False        (not a valid INI key; default behavior is already False)
#                fail_fast = False         (never a pytest option — RSpec/Jest terminology)
#                maxfail = 5               (real option but only valid as --maxfail=5 in addopts; moved below)
#                random_order = False      (requires pytest-random-order; False is the pytest default anyway)
#                random_order_bucket       (companion to above)

# Test discovery
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Repo root on sys.path — REQUIRED under the embedded interpreter (§1).
#
# .venv-brain is built on python-3.13-embed, and an embedded build's `._pth`
# REPLACES sys.path outright: the working directory is never added and
# PYTHONPATH is ignored entirely. So `import memory` / `import tests.helpers`
# resolve only if something puts the root there deliberately.
#
# Two older compensations exist and neither is sufficient:
#   * tests/conftest.py::pytest_sessionstart inserts the root — but initial
#     conftests are imported during CONFIGURATION, before that hook fires, so
#     tests/memory/conftest.py (`from tests.helpers...` at module level) died
#     at collection with ModuleNotFoundError: No module named 'tests'.
#   * individual modules re-derive the root and insert it themselves
#     (tests/hud/test_chat_route.py:12). That works, but only for files that
#     remember to do it.
#
# `pythonpath` is applied at config time, before conftest import, which is the
# only moment early enough. The value is rootdir-relative, so no absolute path
# is baked in and the tree stays SSD-portable.
pythonpath = .

# Test execution + parallel + coverage + maxfail (single addopts line)
# `--maxfail=5` stops the run after 5 failures — fail-fast for big
# regression sweeps like the P2-S1..S21 convergence runner.
addopts = -v --tb=short --color=yes --maxfail=5 --cov=core --cov=pressure_loop --cov=global_loop --cov=meta_loop --cov=auto_loop --cov=omega_loop --cov=deepsleep_loop --cov=memory --cov=runtime --cov=guardian --cov=knowledge_extractor --cov=autonomic --cov=hud --cov-report=term-missing

# Markers
markers =
    slow:        marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit:        marks unit tests
    e2e:         marks end-to-end tests
    regression:  marks regression tests

# Output
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:TypedDict class 'RequestParamsMeta' allows extra items, but 'extra' configuration is set to `'forbid'`\. The 'extra' configuration value will be ignored\.$:pydantic.warnings.TypedDictExtraConfigWarning

# Log level
log_cli             = True
log_cli_level       = INFO
log_cli_format      = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
